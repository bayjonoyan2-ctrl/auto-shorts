<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Shorts Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Auto-Shorts Generator</h1>
        
        <form id="short-form">
            <div class="input-group">
                <label>Video URL</label>
                <input type="url" id="video_url" placeholder="https://youtube.com/watch?v=..." required>
            </div>
            
            <div class="row">
                <div class="input-group">
                    <label>Number of Shorts</label>
                    <input type="number" id="num_shorts" value="3" min="1" max="10" required>
                </div>
                <div class="input-group">
                    <label>Layout Style</label>
                    <select id="layout" style="padding: 10px; border-radius: 6px; background: #0d1117; color: white; border: 1px solid #30363d;">
                        <option value="custom">Custom (Facecam + Game)</option>
                        <option value="standard">Standard (Center Crop)</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" id="submit-btn">Generate Shorts</button>
        </form>

        <div id="status" class="hidden">
            <p id="status-text">Processing... Please wait.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
