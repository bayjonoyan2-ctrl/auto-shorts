<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Shorts Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Auto-Shorts Generator</h1>
        <p>Paste a video URL and our AI will automatically find the best parts and generate 3 Shorts for you.</p>
        
        <form id="short-form">
            <div class="input-group">
                <label>Video URL (YouTube, Twitch VOD, etc.)</label>
                <input type="url" id="video_url" placeholder="https://youtube.com/watch?v=..." required>
            </div>
            
            <button type="submit" id="submit-btn">Generate Shorts Automatically</button>
        </form>

        <div id="status" class="hidden">
            <p id="status-text">Processing... Please wait.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
