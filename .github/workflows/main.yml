name: Auto-Shorts Generator

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube or Video URL'
        required: true
      num_shorts:
        description: 'Number of Shorts to generate'
        required: true
        default: '3'

jobs:
  process_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install -r scripts/requirements.txt

      # NEW STEP: Create the cookies file securely
      - name: Create Cookies File
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Run Video Processor
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
        run: python scripts/process.py

      - name: Upload Finished Shorts
        uses: actions/upload-artifact@v4
        with:
          name: auto-shorts
          path: short_*.mp4
          retention-days: 1