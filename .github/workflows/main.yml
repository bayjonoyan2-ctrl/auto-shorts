name: Auto-Shorts Generator

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube or Video URL'
        required: true
      num_shorts:
        description: 'Number of Shorts'
        required: true
        default: '3'
      layout:
        description: 'Layout (standard or custom)'
        required: true
        default: 'custom'
        type: choice
        options:
        - standard
        - custom

jobs:
  process_video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Install Python Deps
        run: pip install -r scripts/requirements.txt
      - name: Create Cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
      - name: Run Processor
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
          LAYOUT: ${{ github.event.inputs.layout }}
        run: python scripts/process.py
      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: auto-shorts
          path: short_*.mp4