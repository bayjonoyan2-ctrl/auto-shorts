name: 3. Learn Hype Words (AI Transcription)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste ONE video URL to learn words from'
        required: true

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Install AI Libraries
        run: pip install yt-dlp faster-whisper
      
      # 1. Create cookies FIRST
      - name: Create Cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
        
      # 2. Download Video SECOND
      - name: Download Video
        run: |
          yt-dlp --cookies cookies.txt --js-runtimes deno --remote-components ejs:github --ignore-errors --no-abort-on-error --retries infinite --fragment-retries infinite -f "b[ext=mp4]" -o "video.mp4" "${{ github.event.inputs.video_url }}"
          
      - name: Extract Audio
        run: |
          ffmpeg -i video.mp4 -vn -acodec pcm_s16le -ar 16000 -ac 1 audio.wav
      - name: Transcribe with AI (Chinese)
        run: |
          python -c "
          from faster_whisper import WhisperModel
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, _ = model.transcribe('audio.wav', language='zh', beam_size=5)
          with open('transcript.txt', 'w', encoding='utf-8') as f:
              for seg in segments:
                  f.write(seg.text + '\n')
          "
      - name: Upload Transcript
        uses: actions/upload-artifact@v4
        with:
          name: transcript-text
          path: transcript.txt
          retention-days: 2