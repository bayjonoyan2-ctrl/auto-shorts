name: 1. Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube or Video URL'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Install Dependencies
        run: pip install yt-dlp
      - name: Create Cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
      
      - name: Download Video (FFmpeg Downloader)
        run: |
          # Get the direct video URL
          URL=$(yt-dlp --cookies cookies.txt --js-runtimes deno --remote-components ejs:github -g -f "b[ext=mp4]" "${{ github.event.inputs.video_url }}" | head -n 1)
          # Use FFmpeg to download the file natively (bypasses yt-dlp download errors)
          ffmpeg -y -headers "Cookie: $(cat cookies.txt | grep -v '^#' | awk '{print $6"="$7}' | tr '\n' ';')" -i "$URL" -c copy video.mp4
          
      - name: Save Video to Cloud
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: video.mp4
          retention-days: 3