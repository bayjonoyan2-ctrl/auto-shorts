name: 2. Process Video (No Download)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (auto or manual)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - manual
      num_shorts:
        description: 'How many Shorts?'
        required: true
        default: '3'
      timestamps:
        description: 'Manual Mode: Paste times (e.g. 00:01:00, 00:05:30)'
        required: false
        default: ''
      duration_mins:
        description: 'Manual Mode: Duration Minutes'
        required: false
        default: '0'
      duration_secs:
        description: 'Manual Mode: Duration Seconds'
        required: false
        default: '30'
      layout:
        description: 'Layout'
        required: true
        default: 'author'
        type: choice
        options:
        - author
        - standard

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install AI Libraries
        run: pip install numpy soundfile tensorflow-cpu tensorflow-hub scipy funasr modelscope torch torchaudio llama-cpp-python huggingface_hub kagglehub
      
      - name: Download Saved Video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=download.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "Found Download Run ID: $RUN_ID"
          gh run download $RUN_ID -n downloaded-video

      - name: Run AI Processor
        env:
          MODE: ${{ github.event.inputs.mode }}
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
          TIMESTAMPS: ${{ github.event.inputs.timestamps }}
          DURATION_MINS: ${{ github.event.inputs.duration_mins }}
          DURATION_SECS: ${{ github.event.inputs.duration_secs }}
          LAYOUT: ${{ github.event.inputs.layout }}
        run: python scripts/process_saved.py
        
      - name: Upload Shorts and Titles
        uses: actions/upload-artifact@v4
        with:
          name: final-shorts
          path: |
            short_*.mp4
            short_*.srt
            short_*.txt