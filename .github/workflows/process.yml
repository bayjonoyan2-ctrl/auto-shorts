name: 2. Process Video (No Download)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (auto or manual)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - manual
      num_shorts:
        description: 'How many Shorts?'
        required: true
        default: '3'
      layout:
        description: 'Layout'
        required: true
        default: 'author'
        type: choice
        options:
        - author
        - standard

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Saved Video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=download.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "Found Download Run ID: $RUN_ID"
          gh run download $RUN_ID -n downloaded-video

      - name: Run AI in Docker (Python 3.11 Environment)
        env:
          MODE: ${{ github.event.inputs.mode }}
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
          LAYOUT: ${{ github.event.inputs.layout }}
        run: |
          # This spins up a clean Python 3.11 machine inside GitHub Actions
          docker run --rm -v "$PWD:/app" -w /app python:3.11-slim bash -c "
            apt-get update && apt-get install -y ffmpeg
            pip install numpy soundfile scipy kagglehub huggingface_hub
            pip install tensorflow-cpu tensorflow-hub tf-keras
            pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install funasr modelscope llama-cpp-python
            python scripts/process_saved.py
          "
          
      - name: Upload Shorts and Titles
        uses: actions/upload-artifact@v4
        with:
          name: final-shorts
          path: |
            short_*.mp4
            title_*.txt
