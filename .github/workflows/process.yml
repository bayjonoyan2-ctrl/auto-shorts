name: 2. Process Video

on:
  workflow_dispatch:
    inputs:
      num_shorts:
        description: 'How many Shorts?'
        required: true
        default: '3'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install AI Libraries
        run: pip install numpy soundfile tensorflow-cpu tensorflow-hub scipy funasr modelscope torch torchaudio llama-cpp-python huggingface_hub
      
      - name: Download Saved Video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=download.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          gh run download $RUN_ID -n downloaded-video

      - name: Run AI Processor
        env:
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
        run: python scripts/process_saved.py
        
      - name: Upload Shorts and Titles
        uses: actions/upload-artifact@v4
        with:
          name: final-shorts
          path: |
            short_*.mp4
            short_*.srt
            short_*.txt