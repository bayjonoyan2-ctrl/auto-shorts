name: 2. Process Video (No Download)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (auto or manual)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - manual
      num_shorts:
        description: 'How many Shorts?'
        required: true
        default: '3'
      layout:
        description: 'Layout'
        required: true
        default: 'author'
        type: choice
        options:
        - author
        - standard

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          
      - name: Install AI Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy soundfile scipy kagglehub
          python -m pip install tensorflow-cpu tensorflow-hub
      
      - name: Download Saved Video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=download.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "Found Download Run ID: $RUN_ID"
          gh run download $RUN_ID -n downloaded-video

      - name: Run AI Processor
        env:
          MODE: ${{ github.event.inputs.mode }}
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
          LAYOUT: ${{ github.event.inputs.layout }}
        run: python scripts/process_saved.py
        
      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: final-shorts
          path: short_*.mp4
