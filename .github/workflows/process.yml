name: 2. Process Video (No Download)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (auto or manual)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - manual
      num_shorts:
        description: 'How many Shorts? (Only for Auto)'
        required: true
        default: '3'
      timestamps:
        description: 'Timestamps e.g. 00:01:00, 00:05:30 (Only for Manual)'
        required: false
        default: ''
      duration_mins:
        description: 'Duration Minutes (Only for Manual)'
        required: false
        default: '0'
      duration_secs:
        description: 'Duration Seconds (Only for Manual)'
        required: false
        default: '30'
      layout:
        description: 'Layout'
        required: true
        default: 'author'
        type: choice
        options:
        - author
        - standard

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download Saved Video
        uses: actions/download-artifact@v4
        with:
          name: downloaded-video
          path: .
      - name: Run AI Processor
        env:
          MODE: ${{ github.event.inputs.mode }}
          NUM_SHORTS: ${{ github.event.inputs.num_shorts }}
          TIMESTAMPS: ${{ github.event.inputs.timestamps }}
          DURATION_MINS: ${{ github.event.inputs.duration_mins }}
          DURATION_SECS: ${{ github.event.inputs.duration_secs }}
          LAYOUT: ${{ github.event.inputs.layout }}
        run: python scripts/process_saved.py
      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: final-shorts
          path: short_*.mp4